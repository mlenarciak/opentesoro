name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun install --cwd infra --frozen-lockfile
      - run: bun run check
      - run: bun run infra:typecheck && bun run infra:test
      - run: bun run infra:synth -- --lookups false --output /tmp/opentesoro-ci-assembly
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: eu-south-1
          AWS_REGION: eu-south-1
          AWS_DEFAULT_REGION: eu-south-1
      - run: docker build --file Dockerfile.public-demo --tag opentesoro-demo-check .
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
